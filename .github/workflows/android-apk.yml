name: Android-App bauen

# Startet von Hand: Reiter "Actions" -> "Android-App bauen" -> "Run workflow"
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: APK erzeugen
    runs-on: ubuntu-latest
    steps:
      - name: Dateien holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Web-Dateien einsammeln
        run: |
          mkdir -p www
          cp index.html app.js styles.css manifest.webmanifest www/
          cp *.png www/
          ls -la www

      - name: Ablage-Adresse hinterlegen (optional)
        # Nur wirksam, wenn unter Settings -> Secrets -> Actions ein Secret
        # namens SYNC_URL angelegt wurde. Ohne Secret bleibt alles wie bisher.
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
        run: |
          if [ -n "$SYNC_URL" ]; then
            printf 'window.__U11_SYNC_URL__ = %s;\n' "$(node -e 'process.stdout.write(JSON.stringify(process.env.SYNC_URL))')" > www/config.js
            echo "Adresse hinterlegt (Laenge: ${#SYNC_URL} Zeichen)"
          else
            echo "Kein Secret SYNC_URL gesetzt - die App fragt die Adresse beim ersten Start ab."
          fi

      - name: Abhaengigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Android-Projekt anlegen
        run: npx cap add android

      - name: App-Symbole erzeugen
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'
        continue-on-error: true

      - name: Web-Dateien in das Projekt kopieren
        run: npx cap sync android

      - name: APK bauen
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: u11-kaderplaner-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
